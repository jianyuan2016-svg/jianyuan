<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          blue: '#2563eb',
          green: '#10b981',
          amber: '#f59e0b',
          rose: '#f43f5e',

</script>
<style>
  :root {
    --blue: #2563eb; --green: #10b981; --amber: #f59e0b; --rose: #f43f5e;
    --bg1: #f8fafc; --bg2: #ffffff; --text1: #0f172a; --text2: #475569; --text3: #94a3b8;
    --glass: rgba(255, 255, 255, 0.7); --border: rgba(226, 232, 240, 0.8);
  }
  * { -webkit-tap-highlight-color: transparent; outline: none; font-family: 'Nunito', 'Noto Sans TC', sans-serif; }
  body { background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 50%, #fffbeb 100%); background-attachment: fixed; min-height: 100vh; color: var(--text1); }
  .glass { background: var(--glass); backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
  .btn-hover { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .btn-hover:active { transform: scale(0.95); opacity: 0.8; }
  .nav-active { color: var(--blue); position: relative; }
  .nav-active::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--blue); }
  .card-urgent { border: 2px solid var(--rose) !important; animation: pulse-red 2s infinite; }
  @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); } }
  .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }
  @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body class="pb-24">

<header class="sticky top-0 z-40 glass border-b px-4 py-3 flex justify-between items-center">
  <div class="flex items-center gap-2">
    <div class="w-10 h-10 bg-blue rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue/30">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    </div>
    <h1 class="font-black text-xl tracking-tight">EV <span class="text-blue">PRO</span></h1>
  </div>
  <div class="flex items-center gap-3">
    <div id="sync-indicator" class="w-2.5 h-2.5 rounded-full bg-slate shadow-[0_0_8px_rgba(0,0,0,0.1)] transition-colors duration-500"></div>
    <div id="today-date" class="text-right text-[10px] font-bold leading-tight text-slate"></div>
  </div>
</header>

<main id="app-content" class="p-4 max-w-md mx-auto space-y-6">
  </main>

<nav class="fixed bottom-0 left-0 right-0 z-50 glass border-t px-6 py-3 flex justify-between items-center pb-safe">
  <button onclick="router('home')" id="nav-home" class="btn-hover flex flex-col items-center gap-1 text-slate">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
  </button>
  <button onclick="router('orders')" id="nav-orders" class="btn-hover flex flex-col items-center gap-1 text-slate">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
  </button>
  <button onclick="openOrderModal()" class="btn-hover -mt-10 w-14 h-14 bg-blue rounded-2xl flex items-center justify-center text-white shadow-xl shadow-blue/40 border-4 border-white">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg>
  </button>
  <button onclick="router('finance')" id="nav-finance" class="btn-hover flex flex-col items-center gap-1 text-slate">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
  </button>
  <button onclick="router('settings')" id="nav-settings" class="btn-hover flex flex-col items-center gap-1 text-slate">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
  </button>
</nav>

<script>
// 配置區
const API_URL = 'https://script.google.com/macros/s/AKfycbzHXrXJmcUO4bwUUy3lsI6nGblk8eXgPcRTYqFW0IXFKnH0i8LLfLSJFK97tamMFEWeDg/exec';
const KEYS = { orders: 'ev_orders', finance: 'ev_finance', memos: 'ev_memos', settings: 'ev_settings' };

// 資料模型
let orders = [];
let finance = {}; 
let currentView = 'home';

// ════════════════════════════════════════
//核心 API 連線函式 (解決 Redirect & CORS)
// ════════════════════════════════════════
async function apiCall(action, data = null, id = null, ym = null) {
  if (!API_URL) return null;
  setSyncStatus('syncing');
  
  try {
    const isPost = action !== 'getOrders';
    const url = isPost ? API_URL : `${API_URL}?action=${action}`;
    
    const options = {
      method: isPost ? 'POST' : 'GET',
      mode: 'cors', // 改回 CORS
      redirect: 'follow', // 必須追蹤重定向
      headers: {
        'Content-Type': 'text/plain;charset=utf-8' // 繞過 Preflight 的穩定寫法
      }
    };

    if (isPost) {
      options.body = JSON.stringify({ action, data, id, ym });
    }

    const response = await fetch(url, options);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const result = await response.json();
    setSyncStatus('success');
    return result;
  } catch (err) {
    console.error('API Error:', err);
    setSyncStatus('error');
    return null;
  }
}

// ════════════════════════════════════════
// 雲端同步邏輯 (Mapping & 防洗掉)
// ════════════════════════════════════════
async function fetchOrdersFromSheets() {
  const res = await apiCall('getOrders');
  
  // 核心判斷：只有 API 有回傳正確資料，才更新本地，防止清空
  if (res && Array.isArray(res.data) && res.data.length > 0) {
    // 進行欄位映射 (中文標題 -> 內部英文 Key)
    orders = res.data.map(r => ({
      date: r['日期'] || '',
      orderId: r['訂單號碼'] || '',
      name: r['姓名'] || '',
      phone: r['電話'] || '',
      model: r['車型'] || '',
      battery: r['電池'] || '',
      amount: Number(r['金額']) || 0,
      cost: Number(r['成本']) || 0,
      status: r['狀態'] || '待交車',
      note: r['備註'] || ''
    }));
    
    save(KEYS.orders, orders);
    renderOrders();
    renderDashboard();
    toast('✓ 雲端資料同步成功');
  } else if (res && Array.isArray(res.data) && res.data.length === 0) {
    console.log('雲端目前為空，不覆蓋本地資料以防萬一');
  } else {
    toast('⚠️ 雲端連線失敗，目前使用本地資料', true);
  }
}

async function pushOrderToSheets(order) {
  // 確保傳送的 Key 符合 GAS 後端解析邏輯
  const payload = {
    date: order.date,
    orderId: order.orderId,
    name: order.name,
    phone: order.phone,
    model: order.model,
    battery: order.battery,
    amount: order.amount,
    cost: order.cost,
    status: order.status,
    note: order.note
  };
  const res = await apiCall('upsertOrder', payload, order.orderId);
  return res && res.result === 'success';
}

// ════════════════════════════════════════
// 基礎工具與渲染 (略過部分重複邏輯)
// ════════════════════════════════════════
const save = (k, d) => localStorage.setItem(k, JSON.stringify(d));
const load = (k) => JSON.parse(localStorage.getItem(k)) || [];

function setSyncStatus(status) {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  el.classList.remove('bg-slate', 'bg-green-500', 'bg-rose-500', 'animate-pulse');
  if (status === 'syncing') { el.classList.add('bg-amber-500', 'animate-pulse'); }
  else if (status === 'success') { el.classList.add('bg-green-500'); }
  else if (status === 'error') { el.classList.add('bg-rose-500'); }
}

function toast(msg, err=false) {
  const el = document.createElement('div');
  el.className = `fixed top-20 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-2xl glass font-bold text-sm shadow-2xl transition-all duration-500 opacity-0 translate-y-4 ${err?'text-rose-600 border-rose-200':'text-blue-600 border-blue-200'}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.replace('opacity-0','opacity-100'); el.classList.replace('translate-y-4','translate-y-0'); },10);
  setTimeout(()=>{ el.classList.replace('opacity-100','opacity-0'); setTimeout(()=>el.remove(),500); },3000);
}

// ════════════════════════════════════════
// 頁面渲染邏輯 (Home/Orders/Finance/Settings)
// ════════════════════════════════════════
function router(view) {
  currentView = view;
  const content = document.getElementById('app-content');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
  const activeNav = document.getElementById(`nav-${view}`);
  if(activeNav) activeNav.classList.add('nav-active');

  if(view === 'home') renderHome();
  else if(view === 'orders') renderOrders();
  else if(view === 'finance') renderFinance();
  else if(view === 'settings') renderSettings();
}

function renderHome() {
  const content = document.getElementById('app-content');
  const pending = orders.filter(o => o.status === '待交車');
  const profit = orders.reduce((acc, o) => acc + (o.amount - o.cost), 0);
  
  content.innerHTML = `
    <div class="grid grid-cols-2 gap-4">
      <div class="glass p-5 rounded-3xl space-y-1">
        <p class="text-text3 text-[10px] font-bold uppercase tracking-wider">待交車</p>
        <p class="text-3xl font-black text-blue">${pending.length}</p>
      </div>
      <div class="glass p-5 rounded-3xl space-y-1">
        <p class="text-text3 text-[10px] font-bold uppercase tracking-wider">累積毛利</p>
        <p class="text-3xl font-black text-green">$${profit.toLocaleString()}</p>
      </div>
    </div>
    
    <div class="space-y-3">
      <h3 class="font-bold flex justify-between items-center px-1">
        <span>最近更新</span>
        <button onclick="fetchOrdersFromSheets()" class="text-blue text-xs font-bold">同步雲端</button>
      </h3>
      <div id="home-recent-list" class="space-y-3">
        </div>
    </div>
  `;
  
  const recentList = document.getElementById('home-recent-list');
  orders.slice(-3).reverse().forEach(o => {
    recentList.innerHTML += `
      <div class="glass p-4 rounded-3xl flex justify-between items-center">
        <div>
          <p class="font-bold">${o.name} <span class="text-xs text-text3 font-normal">#${o.orderId}</span></p>
          <p class="text-xs text-text2">${o.model} · ${o.battery}</p>
        </div>
        <span class="text-xs font-bold px-3 py-1 rounded-full ${o.status==='待交車'?'bg-amber-100 text-amber-600':'bg-green-100 text-green-600'}">${o.status}</span>
      </div>
    `;
  });
}

function renderOrders() {
  const content = document.getElementById('app-content');
  content.innerHTML = `
    <div class="flex gap-2 sticky top-[72px] z-30 py-2">
      <div class="glass flex-1 rounded-2xl px-4 py-2 flex items-center gap-2">
        <svg class="w-4 h-4 text-text3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" placeholder="搜尋姓名、電話、訂單..." class="bg-transparent text-sm w-full" oninput="searchOrders(this.value)">
      </div>
    </div>
    <div id="order-list" class="space-y-4"></div>
  `;
  renderOrderCards(orders);
}

function renderOrderCards(list) {
  const container = document.getElementById('order-list');
  if(!container) return;
  container.innerHTML = '';
  
  [...list].reverse().forEach(o => {
    // 檢查是否超過 7 天
    const orderDate = new Date(o.date);
    const today = new Date();
    const diffDays = Math.floor((today - orderDate) / (1000 * 60 * 60 * 24));
    const isUrgent = diffDays >= 7 && o.status === '待交車';

    const card = document.createElement('div');
    card.className = `glass p-5 rounded-[2.5rem] relative overflow-hidden transition-all ${isUrgent ? 'card-urgent' : ''}`;
    card.innerHTML = `
      <div class="flex justify-between items-start mb-4">
        <div>
          <p class="text-[10px] font-black text-text3 uppercase tracking-widest mb-1">${o.date}</p>
          <h4 class="text-lg font-black tracking-tight">${o.name} <span class="text-blue">#${o.orderId}</span></h4>
        </div>
        <span class="text-[10px] font-black px-3 py-1.5 rounded-xl ${o.status==='待交車'?'bg-amber-100 text-amber-600':'bg-green-100 text-green-600'}">${o.status}</span>
      </div>
      <div class="grid grid-cols-2 gap-y-3 mb-5 text-sm font-bold">
        <div class="text-text2">車型: <span class="text-text1">${o.model}</span></div>
        <div class="text-text2">電池: <span class="text-text1">${o.battery}</span></div>
        <div class="text-text2">金額: <span class="text-blue">$${Number(o.amount).toLocaleString()}</span></div>
        <div class="text-text2">利潤: <span class="text-green">$${(o.amount-o.cost).toLocaleString()}</span></div>
      </div>
      <div class="flex gap-2">
        <button onclick="deleteOrder('${o.orderId}')" class="btn-hover flex-1 py-3 rounded-2xl bg-rose-50 text-rose-600 text-xs font-black">刪除</button>
        <button onclick="toggleOrderStatus('${o.orderId}')" class="btn-hover flex-[2] py-3 rounded-2xl bg-blue text-white text-xs font-black shadow-lg shadow-blue/20">變更狀態</button>
      </div>
    `;
    container.appendChild(card);
  });
}

// ════════════════════════════════════════
// 新增訂單邏輯
// ════════════════════════════════════════
async function openOrderModal() {
  const id = 'ORD' + Date.now().toString().slice(-4);
  const date = new Date().toISOString().split('T')[0];
  
  // 這裡使用原生的 prompt 作為快速輸入，你也可以改成 HTML Modal
  const name = prompt("客戶姓名");
  if(!name) return;
  const model = prompt("車型 (如: EZ1, Ai-1)");
  const battery = prompt("電池種類 (手動輸入)");
  const amount = Number(prompt("訂單總額"));
  const cost = Number(prompt("車輛成本"));

  const newOrder = {
    date,
    orderId: id,
    name,
    phone: '',
    model,
    battery,
    amount,
    cost,
    status: '待交車',
    note: ''
  };

  orders.push(newOrder);
  save(KEYS.orders, orders);
  renderOrders();
  toast('⌛ 同步至雲端中...');
  
  const success = await pushOrderToSheets(newOrder);
  if(success) toast('✓ 雲端同步完成');
  else toast('❌ 僅存於本地，雲端失敗', true);
}

async function toggleOrderStatus(id) {
  const idx = orders.findIndex(o => o.orderId === id);
  if(idx === -1) return;
  orders[idx].status = orders[idx].status === '待交車' ? '已完結' : '待交車';
  save(KEYS.orders, orders);
  renderOrders();
  await pushOrderToSheets(orders[idx]);
}

// ════════════════════════════════════════
// 初始化
// ════════════════════════════════════════
window.onload = () => {
  orders = load(KEYS.orders);
  router('home');
  updateDateDisplay();
  
  // 啟動後 1 秒自動從雲端抓取一次最新資料
  setTimeout(() => {
    fetchOrdersFromSheets();
  }, 1000);
};

function updateDateDisplay(){
  const now=new Date();const days=['日','一','二','三','四','五','六'];
  const str=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} 星期${days[now.getDay()]}`;
  const el=document.getElementById('today-date');if(el)el.innerHTML=str;
}

function renderSettings() {
  const content = document.getElementById('app-content');
  content.innerHTML = `
    <div class="glass p-6 rounded-[2.5rem] space-y-4">
      <h3 class="font-black text-lg">系統設定</h3>
      <button onclick="fetchOrdersFromSheets()" class="w-full py-4 rounded-2xl bg-blue text-white font-bold shadow-lg shadow-blue/20">立即與雲端同步</button>
      <button onclick="clearLocalData()" class="w-full py-4 rounded-2xl bg-rose-50 text-rose-600 font-bold border border-rose-100">清除本地緩存資料</button>
      <div class="pt-4 border-t text-[10px] text-text3 font-bold space-y-1">
        <p>API 狀態: <span id="api-status">檢查中...</span></p>
        <p>版本: 4.0.0 (Final Sync Fix)</p>
      </div>
    </div>
  `;
}

async function clearLocalData() {
  if(confirm('確定要清除手機本地資料嗎？雲端資料不會被刪除。')){
    localStorage.clear();
    location.reload();
  }
}
</script>
</body>
</html>
